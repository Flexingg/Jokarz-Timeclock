name: Build APK

# Builds the installable APK in CI instead of on a local machine (the local box
# has a full swap and has been OOM-killed mid-build before). Runs on every v* tag
# and can be triggered by hand:
#     gh workflow run build-apk.yml --repo Flexingg/Jokarz-Timeclock
#
# Release signing is REQUIRED here (repository secrets below). There is no debug-key
# fallback any more: v2.8.2's CI artifact came out debug-signed because the release
# variant silently fell back, and a debug-signed APK cannot install over the release
# build. If the secrets are missing the release build now fails, and the verification
# gate below would fail it anyway.
#     KEYSTORE_BASE64     base64 -w0 of the canonical release .jks
#     KEYSTORE_PASSWORD   keystore password
#     KEY_ALIAS           key alias
#     KEY_PASSWORD        key password

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test, assemble, verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      # The repo commits a wrapper, but CI must never hard-depend on ./gradlew
      # existing: a missing wrapper is exactly what broke the first CI runs.
      # Prefer the wrapper; otherwise fall back to the `gradle` that
      # gradle/actions/setup-gradle put on PATH.
      - name: Locate the Gradle entrypoint
        id: gradle_cmd
        run: |
          set -e
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            echo "using the committed wrapper: ./gradlew"
            echo "cmd=./gradlew" >> "$GITHUB_OUTPUT"
          elif command -v gradle >/dev/null 2>&1; then
            echo "::warning::./gradlew is missing - falling back to the gradle on PATH"
            echo "cmd=gradle" >> "$GITHUB_OUTPUT"
          else
            echo "::error::no Gradle entrypoint: neither ./gradlew nor gradle is available"
            exit 1
          fi

      # A tag whose name disagrees with versionName is how a release ends up shipping the
      # wrong build. Compare them before anything is built.
      - name: Check the tag against versionName
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -e
          TAG="${GITHUB_REF_NAME#v}"
          NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          echo "tag=$GITHUB_REF_NAME versionName=$NAME versionCode=$CODE"
          if [ "$TAG" != "$NAME" ]; then
            echo "::error::tag v$TAG does not match versionName $NAME"
            exit 1
          fi
          echo "VERSION=$NAME" >> "$GITHUB_ENV"

      - name: Run the test suite
        env:
          GRADLE_CMD: ${{ steps.gradle_cmd.outputs.cmd }}
        run: $GRADLE_CMD test --no-daemon --console=plain

      # Gradle only prints "N tests completed" when something fails, so record the count on
      # green runs too. Never fails the job - it is reporting, not gating.
      - name: Summarise the test count
        if: always()
        run: |
          shopt -s nullglob
          files=(app/build/test-results/*/TEST-*.xml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no test result XML found - nothing to summarise"
            exit 0
          fi
          total=$(grep -ho 'tests="[0-9]*"' "${files[@]}" | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}')
          failed=$(grep -ho 'failures="[0-9]*"' "${files[@]}" | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}')
          errors=$(grep -ho 'errors="[0-9]*"' "${files[@]}" | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}')
          echo "TESTS: $total executed, $failed failed, $errors errored (${#files[@]} result files)"

      - name: Decode the release signing keystore (required)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not configured - refusing to build an unsignable release"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "keystore written: $(stat -c %s "$RUNNER_TEMP/release.keystore") bytes"

      # No fallback to assembleDebug: a debug-signed APK is not a release artifact.
      - name: Assemble the release APK
        env:
          GRADLE_CMD: ${{ steps.gradle_cmd.outputs.cmd }}
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: $GRADLE_CMD assembleRelease --no-daemon --console=plain

      # THE GATE. Module-agnostic, and deliberately restricted to the build output tree: the
      # repo also carries release APKs at the root for the LAN share, and matching one of those
      # would "verify" a build that never happened. Fails the job unless apksigner reports
      # Verifies with v2+v3, the certificate is not the debug key, and the zip is intact.
      - name: Gate - verify the built APK's signatures and archive
        run: |
          set -e
          APK=$(find ./app/build/outputs/apk -name '*.apk' -print | head -1)
          if [ -z "$APK" ]; then
            echo "::error::no APK was produced by the build"; exit 1
          fi
          chmod +x scripts/verify-apk.sh
          scripts/verify-apk.sh "$APK"
          {
            echo "APK_PATH=$APK"
            echo "APK_NAME=$(basename "$APK")"
            echo "APK_SHA256=$(sha256sum "$APK" | cut -d' ' -f1)"
          } >> "$GITHUB_ENV"

      # A stable, versioned file name for the release asset and the LAN share, plus a .sha256
      # sidecar so the owner can check a download before installing it.
      - name: Stage the verified APK
        run: |
          set -e
          VERSION="${VERSION:-$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)}"
          mkdir -p dist
          cp "$APK_PATH" "dist/JokarzTimeclock-${VERSION}.apk"
          (cd dist && sha256sum "JokarzTimeclock-${VERSION}.apk" > "JokarzTimeclock-${VERSION}.apk.sha256")
          ls -la dist
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Upload the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: timeclock-apk
          path: dist/*
          if-no-files-found: error

      # A published release asset is a promise: its size and sha256 were recorded in the release
      # notes and the docs, so a later CI run must not silently replace it with a (byte-different,
      # non-reproducible) rebuild. Attach only when the release does not already carry this APK.
      - name: Does the release already carry an APK?
        if: startsWith(github.ref, 'refs/tags/')
        id: release_asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VERSION="${VERSION:-$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)}"
          NAME="JokarzTimeclock-${VERSION}.apk"
          EXISTING=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                       --json assets --jq '.assets[].name' 2>/dev/null || true)
          if printf '%s\n' "$EXISTING" | grep -qx "$NAME"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME is already published on $GITHUB_REF_NAME - keeping it (its recorded sha256 stands)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Attach the APK to the GitHub release
        if: startsWith(github.ref, 'refs/tags/') && steps.release_asset.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: 'dist/*'
          fail_on_unmatched_files: true
